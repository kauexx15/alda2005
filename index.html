<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feliz Aniversário 🎉</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff6a88, #ff99ac);
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  color: white;
  overflow: hidden;
}

/* TÍTULO */
h1 {
  margin-top: 20px;
  font-size: 3em;
  animation: fade 2s ease;
}

/* FOTO PRINCIPAL */
.foto-topo {
  width: 140px;
  border-radius: 50%;
  border: 4px solid white;
  box-shadow: 0 0 20px rgba(255,255,255,0.7);
  animation: float 3s ease-in-out infinite;
}

/* BOLO */
.cake {
  position: relative;
  width: 220px;
  height: 160px;
  margin: 40px auto;
}

.layer {
  position: absolute;
  width: 100%;
  height: 50px;
  border-radius: 15px;
}

.layer1 { bottom: 0; background: #8b4513; }
.layer2 { bottom: 40px; background: #a0522d; }
.layer3 { bottom: 80px; background: #cd853f; }

.icing {
  position: absolute;
  width: 100%;
  height: 30px;
  background: #ffdde1;
  top: -10px;
  border-radius: 15px;
}

/* FOTO NO BOLO */
.cake img {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  top: 30px;
  left: 65px;
  border: 3px solid white;
}

/* VELA */
.candle {
  position: absolute;
  width: 12px;
  height: 50px;
  background: gold;
  top: -60px;
  left: 104px;
}

.flame {
  width: 18px;
  height: 18px;
  background: radial-gradient(circle, yellow, orange, red);
  border-radius: 50%;
  position: absolute;
  top: -18px;
  left: -3px;
  animation: flame 0.2s infinite alternate;
}

@keyframes flame {
  from { transform: scale(1); }
  to { transform: scale(1.3); }
}

/* BOTÃO */
button {
  padding: 12px 30px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #ff4e50;
  font-size: 1.1em;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

/* TEXTO */
#msg {
  font-size: 1.3em;
  margin-top: 20px;
  opacity: 0;
  transition: 1s;
}

/* BALÕES */
.balloon {
  position: absolute;
  bottom: -100px;
  width: 45px;
  height: 65px;
  border-radius: 50%;
  animation: subir 7s linear infinite;
}

@keyframes subir {
  to { transform: translateY(-120vh); }
}

/* PARTÍCULAS */
.sparkle {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  animation: sparkle 2s infinite;
}

@keyframes sparkle {
  from { opacity: 0; }
  to { opacity: 1; transform: translateY(-20px); }
}

/* ANIMAÇÕES */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<h1>🎉 Feliz Aniversário! 🎂</h1>

<!-- FOTO PRINCIPAL -->
<img class="foto-topo" src="SUA_FOTO_AQUI.jpg">

<!-- BOLO -->
<div class="cake">
  <div class="layer layer1"></div>
  <div class="layer layer2"></div>
  <div class="layer layer3"></div>
  <div class="icing"></div>

  <!-- FOTO NO BOLO -->
  <img src="SUA_FOTO_AQUI.jpg">

  <div class="candle">
    <div class="flame"></div>
  </div>
</div>

<button onclick="mostrar()">Abrir mensagem 🎁</button>
<p id="msg"></p>

<!-- MÚSICA (opcional) -->
<audio autoplay loop>
  <source src="https://www.myinstants.com/media/sounds/happy-birthday.mp3" type="audio/mpeg">
</audio>

<script>
function mostrar() {
  let msg = document.getElementById("msg");
  msg.innerHTML = "Feliz aniversário, meu parceiro! 🎉🔥 Que tua vida seja só sucesso!";
  msg.style.opacity = 1;
}

/* BALÕES */
setInterval(() => {
  let b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.random() * 100 + "vw";
  b.style.background = "hsl(" + Math.random()*360 + ",70%,60%)";
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 7000);
}, 500);

/* PARTÍCULAS */
setInterval(() => {
  let s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 2000);
}, 200);
</script>

</body>
</html>
