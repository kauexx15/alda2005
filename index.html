<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Feliz Aniversário 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      margin-top: 50px;
      animation: aparecer 2s ease;
    }

    p {
      font-size: 1.5em;
      animation: aparecer 3s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 50px;
      height: 70px;
      background: red;
      border-radius: 50%;
      animation: subir 6s linear infinite;
    }

    @keyframes subir {
      from { transform: translateY(0); }
      to { transform: translateY(-110vh); }
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      background: white;
      color: #ff4e50;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #ffe3e3;
    }
  </style>
</head>

<body>

  <h1>🎂 Feliz Aniversário! 🎉</h1>
  <p>Hoje é um dia especial cheio de alegria!</p>
  <p id="mensagem"></p>

  <button onclick="mostrarMensagem()">Clique para surpresa 🎁</button>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").innerHTML =
        "Que seu dia seja incrível, cheio de felicidade, saúde e sucesso! 💖";
    }

    // criar balões animados
    function criarBalao() {
      const balao = document.createElement("div");
      balao.classList.add("balloon");
      balao.style.left = Math.random() * 100 + "vw";
      balao.style.background = "hsl(" + Math.random()*360 + ", 70%, 60%)";
      document.body.appendChild(balao);

      setTimeout(() => {
        balao.remove();
      }, 6000);
    }

    setInterval(criarBalao, 500);
  </script>

</body>
</html>
