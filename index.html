<style>
/* ── ÁREA ── */
.bday{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6rem 1rem;
  text-align:center;
}

/* TEXTO */
.bday h2{
  font-family:'Playfair Display',serif;
  font-size:2.4rem;
  color:#c4b5fd;
  margin-top:2rem;
  letter-spacing:.5px;
}

/* BOLO REALISTA CLEAN */
.cake-box{
  position:relative;
  width:160px;
  height:120px;
}

/* BASE */
.cake-base{
  position:absolute;
  bottom:0;
  width:100%;
  height:70px;
  background:linear-gradient(#5a3523,#3d2316);
  border-radius:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

/* CAMADA */
.cake-layer{
  position:absolute;
  bottom:55px;
  width:100%;
  height:30px;
  background:#7a4a2d;
  border-radius:10px;
}

/* COBERTURA */
.cake-top{
  position:absolute;
  bottom:70px;
  width:100%;
  height:35px;
  background:#fff;
  border-radius:12px;
}

/* GOTEJOS MAIS NATURAIS */
.drip{
  position:absolute;
  top:0;
  width:14px;
  background:white;
  border-radius:10px;
}
.d1{left:20px;height:18px;}
.d2{left:50px;height:26px;}
.d3{left:80px;height:20px;}
.d4{left:110px;height:24px;}

/* VELA */
.candle{
  position:absolute;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  width:8px;
  height:45px;
  background:white;
  border-radius:2px;
}

/* CHAMA BONITA */
.flame{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:16px;
  background:radial-gradient(circle,#ffd54d,#ff9800);
  border-radius:50% 50% 50% 50%;
  animation:flame 0.4s infinite alternate;
  box-shadow:0 0 12px #ffcc00;
}

@keyframes flame{
  from{transform:translateX(-50%) scale(1);}
  to{transform:translateX(-50%) scale(1.25);}
}

/* CONFETE SUAVE IGUAL IMAGEM */
.confetti{
  position:fixed;
  width:6px;
  height:6px;
  background:#fbcfe8;
  border-radius:2px;
  animation:fall linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);}
  100%{transform:translateY(110vh) rotate(360deg);}
}

/* BOTÃO */
.bday-btn{
  margin-top:1.8rem;
  background:linear-gradient(135deg,#7c3aed,#c4b5fd);
  border:none;
  padding:.7rem 1.6rem;
  border-radius:999px;
  color:white;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 25px rgba(109,40,217,.5);
  transition:.2s;
}
.bday-btn:hover{transform:scale(1.07);}
</style>

<div class="bday">

  <div class="cake-box">
    <div class="cake-base"></div>
    <div class="cake-layer"></div>

    <div class="cake-top">
      <div class="drip d1"></div>
      <div class="drip d2"></div>
      <div class="drip d3"></div>
      <div class="drip d4"></div>
    </div>

    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <h2>Happy Birthday my Love ❤️</h2>

  <button class="bday-btn" onclick="startBday()">Ativar 🎉</button>

</div>

<audio id="bdayMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>

<script>
// CONFETE IGUAL O DA IMAGEM (leve e bonito)
function spawnConfetti(){
  for(let i=0;i<40;i++){
    let c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(Math.random()*3+3)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}

// BOTÃO
function startBday(){
  spawnConfetti();
  document.getElementById('bdayMusic').play();
}

// LOOP SUAVE
setInterval(spawnConfetti,4000);
</script>
