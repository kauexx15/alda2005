<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Feliz Aniversário ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #f8b6b6;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe Script', cursive;
}

/* CONFETES */
.confete {
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    opacity: 0.8;
    animation: cair linear infinite;
}

@keyframes cair {
    0% { transform: translateY(-10px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}

/* BOLO */
.bolo {
    position: relative;
    width: 200px;
    height: 120px;
    background: #6b3e26;
    border-radius: 10px;
}

.cobertura {
    position: absolute;
    top: -20px;
    width: 100%;
    height: 40px;
    background: white;
    border-radius: 10px;
}

.vela {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 60px;
    background: white;
}

.chama {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 18px;
    background: gold;
    border-radius: 50%;
    animation: fogo 0.5s infinite alternate;
}

@keyframes fogo {
    from { transform: translateX(-50%) scale(1); }
    to { transform: translateX(-50%) scale(1.2); }
}

/* TEXTO */
.texto {
    position: absolute;
    bottom: 80px;
    font-size: 32px;
    color: #7a2d4f;
}

/* CORAÇÃO */
.coracao {
    position: absolute;
    right: 40px;
    bottom: 40px;
    font-size: 40px;
    animation: bater 1s infinite;
}

@keyframes bater {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

</style>
</head>

<body>

<div class="bolo">
    <div class="cobertura"></div>
    <div class="vela">
        <div class="chama"></div>
    </div>
</div>

<div class="texto">Happy Birthday my Love!</div>
<div class="coracao">❤️</div>

<script>
// GERAR CONFETES
for (let i = 0; i < 50; i++) {
    let c = document.createElement("div");
    c.classList.add("confete");

    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (Math.random() * 3 + 2) + "s";

    document.body.appendChild(c);
}
</script>

</body>
</html>
