<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@400;600&family=Caveat&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Quicksand';
  background:#0d0a1a;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:6rem 2rem;
}
.hero h1{
  font-size:4rem;
  font-family:'Playfair Display';
}
.hero span{color:#a78bfa;}
.hero p{font-family:'Caveat';font-size:1.5rem;color:#aaa;}

.cake img{
  width:180px;
  border-radius:20px;
  margin-top:1rem;
  box-shadow:0 0 30px #8b5cf6;
}

/* POSTS */
.box{
  max-width:700px;
  margin:auto;
  padding:1rem;
}

input,textarea{
  width:100%;
  padding:.6rem;
  margin:.4rem 0;
  border-radius:10px;
  border:none;
}

button{
  background:#7c3aed;
  color:white;
  border:none;
  padding:.6rem 1.2rem;
  border-radius:999px;
  cursor:pointer;
}

.post{
  background:#1a1430;
  padding:1rem;
  border-radius:15px;
  margin-top:.8rem;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Feliz <span>Aniversário</span> 🎂</h1>
  <p>Hoje é seu dia! 💜</p>

  <div class="cake">
    <img src="https://i.imgur.com/4M34hi2.png">
  </div>
</div>

<div class="box">
  <h2>Deixe uma mensagem 🎉</h2>

  <input id="nome" placeholder="Seu nome">
  <textarea id="msg" placeholder="Mensagem..."></textarea>
  <input type="file" id="foto">

  <button onclick="enviar()">Enviar</button>

  <div id="feed"></div>
</div>

<script>
// 🔥 COLOCA SUAS CHAVES AQUI
const SUPABASE_URL = "COLE_AQUI";
const SUPABASE_KEY = "COLE_AQUI";

// HEADERS
const H = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY,
  "Content-Type":"application/json"
};

// POST
async function enviar(){
  const nome = document.getElementById("nome").value || "Anônimo";
  const texto = document.getElementById("msg").value;

  if(!texto) return;

  const res = await fetch(`${SUPABASE_URL}/rest/v1/posts`,{
    method:"POST",
    headers:H,
    body: JSON.stringify({author:nome,text:texto})
  });

  const post = (await res.json())[0];

  // upload foto
  const file = document.getElementById("foto").files[0];
  if(file){
    const path = Date.now()+".png";

    await fetch(`${SUPABASE_URL}/storage/v1/object/fotos/${path}`,{
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY
      },
      body:file
    });

    const url = `${SUPABASE_URL}/storage/v1/object/public/fotos/${path}`;

    await fetch(`${SUPABASE_URL}/rest/v1/photos`,{
      method:"POST",
      headers:H,
      body: JSON.stringify({post_id:post.id,url})
    });
  }

  load();
}

// LOAD
async function load(){
  const posts = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*`)
  .then(r=>r.json());

  const photos = await fetch(`${SUPABASE_URL}/rest/v1/photos`)
  .then(r=>r.json());

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  posts.reverse().forEach(p=>{
    const img = photos.find(f=>f.post_id===p.id);

    const div = document.createElement("div");
    div.className="post";
    div.innerHTML = `
      <strong>${p.author}</strong>
      <p>${p.text}</p>
      ${img?`<img src="${img.url}" style="width:100%;border-radius:10px;">`:''}
    `;

    feed.appendChild(div);
  });
}

load();
</script>

</body>
</html>
