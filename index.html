<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Turma Alda 2005</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
}

header{
padding:60px;
}

h1{
font-size:50px;
margin:0;
}

p{
opacity:0.8;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:15px;
margin-top:20px;
backdrop-filter:blur(10px);
}

input{
width:90%;
padding:12px;
margin:8px;
border:none;
border-radius:8px;
outline:none;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
background:#00c6ff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0072ff;
}

.mensagem{
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:10px;
margin-top:10px;
}

footer{
margin-top:50px;
opacity:0.6;
}

</style>
</head>

<body>

<header>

<h1>🎓 Turma Alda 2005</h1>
<p>Site oficial da turma</p>

</header>

<div class="container">

<div class="card">

<h2>Mural da Turma</h2>

<input id="nome" placeholder="Seu nome">
<input id="msg" placeholder="Mensagem">

<br>

<button onclick="enviar()">Enviar</button>

<div id="mural"></div>

</div>

</div>

<footer>

<p>Feito pela Turma Alda 2005</p>

</footer>

<script>

let mural = JSON.parse(localStorage.getItem("mural") || "[]")

function atualizar(){

let div = document.getElementById("mural")
div.innerHTML=""

mural.slice().reverse().forEach(m => {

div.innerHTML += `
<div class="mensagem">
<b>${m.nome}</b>: ${m.msg}
</div>
`

})

}

function enviar(){

let nome = document.getElementById("nome").value
let msg = document.getElementById("msg").value

if(nome=="" || msg=="") return

mural.push({nome,msg})

localStorage.setItem("mural",JSON.stringify(mural))

document.getElementById("msg").value=""

atualizar()

}

atualizar()

</script>

</body>
</html>
