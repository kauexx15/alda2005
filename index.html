<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>🎂 Feliz Aniversário! 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(145deg, #0f0c1f 0%, #1a1030 100%);
    font-family: 'Quicksand', sans-serif;
    color: #fff0f7;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Balões flutuando */
  .balloon {
    position: fixed;
    bottom: -100px;
    pointer-events: none;
    z-index: 1;
    font-size: 2.5rem;
    animation: flyBalloon linear forwards;
  }

  @keyframes flyBalloon {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-120vh) rotate(20deg);
      opacity: 0.3;
    }
  }

  /* Partículas de fundo */
  .stars-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(2px 2px at 20px 30px, #facc15, rgba(0,0,0,0)),
                      radial-gradient(1px 1px at 60px 80px, #f472b6, rgba(0,0,0,0));
    background-size: 200px 200px, 150px 150px;
    background-repeat: repeat;
    opacity: 0.5;
    animation: twinkle 4s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; }
    100% { opacity: 0.8; }
  }

  /* Header */
  .hero {
    text-align: center;
    padding: 2rem 1rem 1rem;
    position: relative;
    z-index: 5;
  }

  .cake-icon {
    font-size: 4.5rem;
    display: inline-block;
    animation: bounceCake 1.5s infinite ease;
    filter: drop-shadow(0 10px 20px rgba(250, 204, 21, 0.4));
  }

  @keyframes bounceCake {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .candle {
    display: inline-block;
    animation: flicker 0.6s infinite alternate;
    margin-left: 5px;
  }

  @keyframes flicker {
    0% { text-shadow: 0 0 2px orange; opacity: 0.9; }
    100% { text-shadow: 0 0 12px #ffb347; opacity: 1; }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4rem);
    background: linear-gradient(135deg, #FDE047, #F472B6, #F43F5E);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0.5rem 0;
  }

  .sub {
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    color: #facc15;
    background: rgba(0,0,0,0.3);
    display: inline-block;
    padding: 0.3rem 1.5rem;
    border-radius: 60px;
  }

  /* Container principal - bolo + fotos lado a lado */
  .main-container {
    max-width: 1200px;
    margin: 1rem auto;
    padding: 0 1rem;
    position: relative;
    z-index: 5;
  }

  .cake-section {
    background: rgba(30, 20, 50, 0.5);
    backdrop-filter: blur(12px);
    border-radius: 50px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(250, 204, 21, 0.3);
    text-align: center;
  }

  .cake-display {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }

  .cake-box {
    text-align: center;
    flex-shrink: 0;
  }

  .cake-emoji {
    font-size: 5rem;
    filter: drop-shadow(0 8px 15px #f97316);
    animation: floatCake 3s infinite alternate;
  }

  @keyframes floatCake {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }

  .cake-message {
    font-family: 'Caveat', cursive;
    font-size: 1.1rem;
    color: #ffedd5;
    margin-top: 0.5rem;
  }

  /* Galeria de fotos - simples ao lado do bolo */
  .photos-gallery {
    flex: 1;
    min-width: 250px;
    background: rgba(0,0,0,0.3);
    border-radius: 32px;
    padding: 1rem;
  }

  .photos-title {
    font-size: 0.9rem;
    font-weight: bold;
    color: #facc15;
    margin-bottom: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    justify-content: center;
  }

  .photos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 0.8rem;
    max-height: 300px;
    overflow-y: auto;
    padding: 0.2rem;
  }

  .photo-card {
    background: #1e1b3a;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(250, 204, 21, 0.3);
  }

  .photo-card:hover {
    transform: scale(1.02);
    border-color: #facc15;
  }

  .photo-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
  }

  .photo-caption {
    padding: 0.3rem;
    font-size: 0.65rem;
    text-align: center;
    background: rgba(0,0,0,0.7);
    color: #ffedd5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Formulário de upload */
  .upload-area {
    background: rgba(30, 20, 50, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 36px;
    padding: 1.2rem;
    margin-top: 1rem;
    border: 1px solid rgba(250, 204, 21, 0.4);
  }

  .upload-area h3 {
    font-size: 1rem;
    color: #facc15;
    margin-bottom: 0.8rem;
    text-align: center;
  }

  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    justify-content: center;
    margin-bottom: 0.8rem;
  }

  .form-row input, .form-row textarea {
    background: #0f0a1f;
    border: 1px solid #facc1566;
    border-radius: 60px;
    padding: 0.6rem 1rem;
    color: white;
    font-family: 'Quicksand', sans-serif;
    outline: none;
    width: 200px;
  }

  .form-row textarea {
    width: 240px;
    border-radius: 28px;
    resize: vertical;
  }

  .file-label {
    background: linear-gradient(145deg, #f97316, #facc15);
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 60px;
    font-weight: bold;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #1a0a2a;
  }

  .publish-btn {
    background: linear-gradient(145deg, #f43f5e, #f97316);
    border: none;
    padding: 0.6rem 1.8rem;
    border-radius: 60px;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
    color: white;
    transition: 0.2s;
  }

  .publish-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 0 15px #f97316;
  }

  .preview-thumb {
    display: flex;
    justify-content: center;
    margin-top: 0.5rem;
  }

  .preview-img {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid #facc15;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.7rem;
    color: #aaa;
    position: relative;
    z-index: 5;
  }

  /* Confetes */
  .confetti-burst {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 14px;
    background: #facc15;
    opacity: 0.9;
    animation: fallConfetti 2s ease-out forwards;
  }

  @keyframes fallConfetti {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffb347, #f97316);
    animation: explode 1s ease-out forwards;
    pointer-events: none;
    z-index: 1000;
  }

  @keyframes explode {
    0% { transform: scale(0.2); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: #1e1230;
    border: 1px solid #facc15;
    padding: 0.6rem 1.5rem;
    border-radius: 60px;
    color: #facc15;
    font-weight: bold;
    z-index: 1000;
    opacity: 0;
    transition: 0.2s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-10px);
  }

  .photos-grid::-webkit-scrollbar { width: 4px; }
  .photos-grid::-webkit-scrollbar-track { background: #1e1b3a; border-radius: 10px; }
  .photos-grid::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }

  @media (max-width: 700px) {
    .cake-display { flex-direction: column; }
    .form-row input, .form-row textarea { width: 90%; }
  }
</style>
</head>
<body>

<div class="stars-bg"></div>

<div class="hero">
  <div class="cake-icon">🎂<span class="candle">🕯️</span></div>
  <h1>Feliz Aniversário! 🎉</h1>
  <div class="sub">Que este dia seja mágico ✨</div>
</div>

<div class="main-container">
  <div class="cake-section">
    <div class="cake-display">
      <div class="cake-box">
        <div class="cake-emoji">🍰🎂🍰</div>
        <div class="cake-message">Bolo da Festa<br>🎈 Parabéns! 🎈</div>
      </div>

      <div class="photos-gallery">
        <div class="photos-title">📸 Fotos do Mural</div>
        <div class="photos-grid" id="photosGrid">
          <div style="grid-column:1/-1; text-align:center;">Carregando fotos...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="upload-area">
    <h3>📸 Adicionar foto ao lado do bolo</h3>
    <div class="form-row">
      <input type="text" id="nomeAmigo" placeholder="Seu nome">
      <textarea id="msgAmigo" rows="1" placeholder="Mensagem de aniversário..."></textarea>
      <label class="file-label">📷 Escolher foto<input type="file" id="fotoInput" accept="image/*" style="display:none;"></label>
    </div>
    <div class="preview-thumb" id="previewArea"></div>
    <div style="text-align: center; margin-top: 0.8rem;">
      <button class="publish-btn" id="publicarBtn">🎉 Postar no mural 🎉</button>
    </div>
  </div>
</div>

<footer>🎂 Feito com carinho - Aniversário Especial 🎂</footer>
<div id="toastMsg" class="toast"></div>

<script>
  // ==================== SUPABASE CONFIG ====================
  const SUPABASE_URL = 'https://nvuwvxggktlwcyhamoyq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52dXd2eGdna3Rsd2N5aGFtb3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NTE3NTAsImV4cCI6MjA4ODQyNzc1MH0.fyfawbJ1pXPjmOSjod1bJsOgYXFg-sriDZuQfaBeiWA';
  const BUCKET_NAME = 'fotos_aniversario';

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json'
  };

  async function carregarFotos() {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/mensagens_aniversario?select=*&order=created_at.desc`, {
        headers: { ...headers, 'Accept': 'application/json' }
      });
      const dados = await response.json();
      renderizarFotos(dados);
    } catch (error) {
      console.error(error);
      document.getElementById('photosGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center;">Erro ao carregar</div>';
    }
  }

  function renderizarFotos(fotos) {
    const grid = document.getElementById('photosGrid');
    if (!fotos || fotos.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center;">✨ Seja o primeiro a postar uma foto! ✨</div>';
      return;
    }
    let html = '';
    fotos.forEach(foto => {
      html += `
        <div class="photo-card" onclick="abrirLightbox('${foto.imagem_url}')">
          <img src="${foto.imagem_url}" alt="foto">
          <div class="photo-caption">💬 ${escapeHtml(foto.mensagem.substring(0, 35))} — ${escapeHtml(foto.nome)}</div>
        </div>
      `;
    });
    grid.innerHTML = html;
  }

  async function uploadImagem(file) {
    const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': file.type
      },
      body: file
    });
    if (!response.ok) throw new Error('Upload falhou');
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${fileName}`;
  }

  async function salvarMensagem(nome, mensagem, imagemUrl) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/mensagens_aniversario`, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        nome: nome,
        mensagem: mensagem,
        imagem_url: imagemUrl,
        created_at: new Date().toISOString()
      })
    });
    if (!response.ok) throw new Error('Erro ao salvar');
    return await response.json();
  }

  let selectedFile = null;
  const fileInput = document.getElementById('fotoInput');
  const previewArea = document.getElementById('previewArea');

  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = function(ev) {
        previewArea.innerHTML = `<img src="${ev.target.result}" class="preview-img" alt="preview">`;
      };
      reader.readAsDataURL(file);
    } else {
      selectedFile = null;
      previewArea.innerHTML = '';
    }
  });

  document.getElementById('publicarBtn').addEventListener('click', async function() {
    const nome = document.getElementById('nomeAmigo').value.trim();
    const mensagem = document.getElementById('msgAmigo').value.trim();

    if (!selectedFile) {
      mostrarToast("📸 Escolha uma foto para postar!");
      return;
    }
    if (!nome) {
      mostrarToast("🖊️ Coloque seu nome!");
      return;
    }
    if (!mensagem) {
      mostrarToast("💬 Escreva uma mensagem!");
      return;
    }

    const btn = document.getElementById('publicarBtn');
    btn.disabled = true;
    btn.textContent = 'Publicando...';

    try {
      const imagemUrl = await uploadImagem(selectedFile);
      await salvarMensagem(nome, mensagem, imagemUrl);

      document.getElementById('nomeAmigo').value = '';
      document.getElementById('msgAmigo').value = '';
      previewArea.innerHTML = '';
      selectedFile = null;
      fileInput.value = '';

      mostrarToast("✅ Foto postada com sucesso! 🎉");
      soltarConfetti(45);
      lancarFogos(15);
      baloesVoadores(8);

      await carregarFotos();
    } catch (error) {
      console.error(error);
      mostrarToast("❌ Erro ao publicar. Tente novamente!");
    } finally {
      btn.disabled = false;
      btn.textContent = '🎉 Postar no mural 🎉';
    }
  });

  // Efeitos
  function soltarConfetti(quantidade = 35) {
    const container = document.createElement('div');
    container.classList.add('confetti-burst');
    document.body.appendChild(container);
    for (let i = 0; i < quantidade; i++) {
      const conf = document.createElement('div');
      conf.classList.add('confetti-piece');
      const cores = ['#facc15', '#f97316', '#f43f5e', '#fb923c', '#fde047', '#a855f7'];
      conf.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
      conf.style.left = Math.random() * 100 + '%';
      conf.style.width = Math.random() * 12 + 5 + 'px';
      conf.style.height = Math.random() * 16 + 6 + 'px';
      conf.style.animationDuration = Math.random() * 1.8 + 1.2 + 's';
      container.appendChild(conf);
      setTimeout(() => conf.remove(), 2500);
    }
    setTimeout(() => container.remove(), 3000);
  }

  function lancarFogos(quantos = 12) {
    for (let i = 0; i < quantos; i++) {
      setTimeout(() => {
        const fogo = document.createElement('div');
        fogo.classList.add('firework');
        fogo.style.left = Math.random() * 100 + '%';
        fogo.style.top = Math.random() * 70 + 10 + '%';
        document.body.appendChild(fogo);
        setTimeout(() => fogo.remove(), 900);
      }, i * 120);
    }
  }

  function baloesVoadores(quantos = 8) {
    const emojis = ['🎈', '🎈', '🎈', '🎈', '🎈'];
    for (let i = 0; i < quantos; i++) {
      setTimeout(() => {
        const balao = document.createElement('div');
        balao.className = 'balloon';
        balao.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        balao.style.left = Math.random() * 100 + '%';
        balao.style.fontSize = (Math.random() * 1.5 + 1.8) + 'rem';
        balao.style.animationDuration = (Math.random() * 4 + 5) + 's';
        balao.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(balao);
        setTimeout(() => balao.remove(), 8000);
      }, i * 200);
    }
  }

  function mostrarToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function abrirLightbox(imgSrc) {
    const modal = document.createElement('div');
    modal.style.position = 'fixed';
    modal.style.inset = '0';
    modal.style.background = 'rgba(0,0,0,0.95)';
    modal.style.backdropFilter = 'blur(12px)';
    modal.style.display = 'flex';
    modal.style.alignItems = 'center';
    modal.style.justifyContent = 'center';
    modal.style.zIndex = '9999';
    modal.style.cursor = 'pointer';
    const img = document.createElement('img');
    img.src = imgSrc;
    img.style.maxWidth = '90vw';
    img.style.maxHeight = '85vh';
    img.style.borderRadius = '24px';
    img.style.border = '3px solid #facc15';
    modal.appendChild(img);
    modal.onclick = () => modal.remove();
    document.body.appendChild(modal);
  }
  window.abrirLightbox = abrirLightbox;

  // Inicializar
  window.addEventListener('load', () => {
    carregarFotos();
    setTimeout(() => {
      soltarConfetti(30);
      baloesVoadores(10);
    }, 500);
  });
</script>
</body>
</html>
